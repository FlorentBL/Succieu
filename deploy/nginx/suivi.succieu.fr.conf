# suivi.succieu.fr → module « Espace Bureau » du hub (succieu.fr).
# À installer APRÈS validation du hub (docs/deploiement-hub.md, étape 10), en remplacement du
# server { } qui proxifiait l'application suivi-bureau. Ne touche pas à succieu.fr.
#
# CERTIFICATS CONSERVÉS : reprendre à l'identique les lignes ssl_certificate / ssl_certificate_key
# (et les include Let's Encrypt éventuels) du fichier actuellement en service pour ce nom ;
# les chemins ci-dessous sont les emplacements Let's Encrypt usuels, à vérifier sur le serveur.

server {
    listen 80;
    listen [::]:80;
    server_name suivi.succieu.fr;

    # Renouvellement des certificats (certbot webroot) : à conserver si l'ancien fichier l'avait.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://succieu.fr/espace-bureau/bureau;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name suivi.succieu.fr;

    ssl_certificate     /etc/letsencrypt/live/suivi.succieu.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/suivi.succieu.fr/privkey.pem;

    # Toute URL (racine ou chemin profond de l'ancienne appli) mène au module : les anciens
    # chemins n'ont pas d'équivalent exact, la page du module est le point d'entrée raisonnable.
    # La chaîne de requête est volontairement abandonnée.
    location / {
        return 301 https://succieu.fr/espace-bureau/bureau;
    }
}
